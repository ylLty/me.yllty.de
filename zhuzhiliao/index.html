<script>
"use strict";
/* ============================================================
 * 物理模拟模块：绳系质点（重力 + 只拉不推弹性绳 + 空气阻力）
 * 1/240s 定步长积分，发声核心变量是绳方向角速度
 * ============================================================ */
class CicadaPhysics {
  constructor() {
    this.anchor = { x: 0, y: 0 };
    this.mass = { x: 0, y: 0 };
    this.vel = { x: 0, y: 0 };
    this.ropeLength = 200;
    this.gravity = 1200;       // 像素/秒²
    this.airDrag = 0.9995;
    this.dt = 1 / 240;         // 定步长积分
    this.accumulator = 0;
    this.prevAngle = 0;
    this.angularVel = 0;
    this.smoothSpeed = 0;
    this.tension = 0;
    this.totalRevolutions = 0;
    this._angleAccum = 0;
  }

  init(ax, ay, ropeLength) {
    this.anchor.x = ax;
    this.anchor.y = ay;
    this.ropeLength = ropeLength;
    this.mass.x = ax;
    this.mass.y = ay + ropeLength;
    this.vel.x = 0;
    this.vel.y = 0;
    this.prevAngle = 0;
    this.angularVel = 0;
    this.smoothSpeed = 0;
    this.totalRevolutions = 0;
    this._angleAccum = 0;
  }

  setAnchor(x, y) {
    this.anchor.x = x;
    this.anchor.y = y;
  }

  kick(vx, vy) {
    this.vel.x += vx;
    this.vel.y += vy;
  }

  update(frameTime) {
    const dt = Math.min(frameTime, 1 / 30);
    this.accumulator += dt;
    let newRevs = 0;
    while (this.accumulator >= this.dt) {
      newRevs += this._step();
      this.accumulator -= this.dt;
    }
    const instantSpeed = Math.abs(this.angularVel) / (2 * Math.PI);
    this.smoothSpeed += (instantSpeed - this.smoothSpeed) * Math.min(1, dt * 12);
    return newRevs;
  }

  _step() {
    const { mass, vel, anchor, dt } = this;
    // 重力
    vel.y += this.gravity * dt;
    // 空气阻力（指数衰减，帧率无关）
    const dragFactor = Math.pow(this.airDrag, dt * 60);
    vel.x *= dragFactor;
    vel.y *= dragFactor;
    // 更新位置
    mass.x += vel.x * dt;
    mass.y += vel.y * dt;
    // 绳子约束（只拉不推）
    const dx = mass.x - anchor.x;
    const dy = mass.y - anchor.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    let ropeTense = false;
    if (dist > this.ropeLength && dist > 0.001) {
      ropeTense = true;
      const nx = dx / dist;
      const ny = dy / dist;
      mass.x = anchor.x + nx * this.ropeLength;
      mass.y = anchor.y + ny * this.ropeLength;
      const radialVel = vel.x * nx + vel.y * ny;
      if (radialVel > 0) {
        vel.x -= radialVel * nx;
        vel.y -= radialVel * ny;
      }
    }
    const stretch = dist > 0.001 ? Math.max(0, (dist - this.ropeLength * 0.85) / (this.ropeLength * 0.15)) : 0;
    this.tension = ropeTense ? 1 : Math.min(1, stretch);
    // 角速度
    const angle = Math.atan2(dx, dy);
    let dAngle = angle - this.prevAngle;
    if (dAngle > Math.PI) dAngle -= 2 * Math.PI;
    if (dAngle < -Math.PI) dAngle += 2 * Math.PI;
    this.angularVel = dAngle / dt;
    // 累计圈数
    this._angleAccum += dAngle;
    let newRevs = 0;
    while (Math.abs(this._angleAccum) >= 2 * Math.PI) {
      if (this._angleAccum > 0) this._angleAccum -= 2 * Math.PI;
      else this._angleAccum += 2 * Math.PI;
      this.totalRevolutions++;
      newRevs++;
    }
    this.prevAngle = angle;
    return newRevs;
  }

  getSpeed() { return this.smoothSpeed; }
  getAngle() { return Math.atan2(this.mass.x - this.anchor.x, this.mass.y - this.anchor.y); }
  isSounding() { return this.smoothSpeed > 1.1 && this.tension > 0.3; }
}

/* ============================================================
 * 声音合成模块（与原版 zhuzhiliao.imsai.cc 合成兜底一致）
 * 锯齿波 → tanh削波 → AM调幅 → 带通哇音 → 三共振峰 → 高通 → 压限
 * ============================================================ */
class CicadaAudio {
  constructor() {
    this.ctx = null;
    this.nodes = {};
    this.initialized = false;
    this.suspended = false;
  }

  init() {
    if (this.initialized) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch(e) { return; }
    var ctx = this.ctx;

    // 锯齿波振荡器（松香黏滑摩擦基音）
    var osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 70;

    // tanh 软削波（增加毛糙谐波）
    var shaper = ctx.createWaveShaper();
    var n = 1024, curve = new Float32Array(n);
    for (var i = 0; i < n; i++) { var x = i/(n-1)*2-1; curve[i] = Math.tanh(x*3.2); }
    shaper.curve = curve; shaper.oversample = '2x';
    osc.connect(shaper);

    // AM 调幅（蝉鸣颗粒感）
    var am = ctx.createGain(); am.gain.value = 0.62;
    var lfo = ctx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 30;
    var lfoAmt = ctx.createGain(); lfoAmt.gain.value = 0.34;
    lfo.connect(lfoAmt); lfoAmt.connect(am.gain);
    shaper.connect(am);

    // 摩擦噪声底
    var nBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    var nd = nBuf.getChannelData(0);
    for (var j = 0; j < nd.length; j++) nd[j] = Math.random()*2-1;
    var noise = ctx.createBufferSource();
    noise.buffer = nBuf; noise.loop = true;
    var nFil = ctx.createBiquadFilter();
    nFil.type = 'bandpass'; nFil.frequency.value = 2500; nFil.Q.value = 0.7;
    var nGain = ctx.createGain(); nGain.gain.value = 0;
    noise.connect(nFil); nFil.connect(nGain);

    // 混合总线
    var bus = ctx.createGain(); bus.gain.value = 0.9;
    am.connect(bus); nGain.connect(bus);

    // 哇音带通滤波器（核心！中心频率随绳角度扫频）
    var wah = ctx.createBiquadFilter();
    wah.type = 'bandpass'; wah.frequency.value = 900; wah.Q.value = 2.2;
    bus.connect(wah);

    // 三并联共振峰（竹膜+筒腔共鸣）
    var sum = ctx.createGain(); sum.gain.value = 1;
    var mkFormant = function(freq, q, g) {
      var f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      var fg = ctx.createGain(); fg.gain.value = g;
      wah.connect(f); f.connect(fg); fg.connect(sum);
    };
    mkFormant(1050, 9, 0.9);
    mkFormant(2150, 11, 0.6);
    mkFormant(3350, 13, 0.4);
    // 直通泄漏（保留原始质感）
    var bleed = ctx.createGain(); bleed.gain.value = 0.07;
    wah.connect(bleed); bleed.connect(sum);

    // 高通去低频隆隆
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 360;
    sum.connect(hp);

    // 主增益 → 压限器 → 输出
    var master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 8;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    hp.connect(master); master.connect(comp); comp.connect(ctx.destination);

    osc.start(); lfo.start(); noise.start();

    this.nodes = { osc, lfo, lfoAmt, am, noise, nFil, nGain, bus, wah,
      formantSum: sum, hp, master, comp };
    this.initialized = true;
    if (ctx.state === 'suspended') ctx.resume().catch(function(){});
  }

  update(speed, ropeAngle, tension) {
    if (!this.initialized || this.suspended) return;
    var ctx = this.ctx, nodes = this.nodes, t = ctx.currentTime;

    // 声音驱动量 active 0~1（降低阈值，更容易出声）
    var active = Math.max(0, Math.min((speed - 0.3) / 1.5, 1));
    var drive = Math.max(0, Math.min((speed - 0.2) / 1.0, 1));

    // 主响度：大幅提升音量
    nodes.master.gain.setTargetAtTime(1.4 * Math.pow(active, 1.1), t, 0.05);

    // 锯齿波频率 55 + rps*17（clamp 50~220）
    var f0 = Math.max(50, Math.min(55 + speed * 20, 220));
    nodes.osc.frequency.setTargetAtTime(f0, t, 0.05);
    // 每圈相位微摆（张力/多普勒感）
    nodes.osc.detune.setTargetAtTime(46 * Math.sin(ropeAngle + 0.9) * Math.min(active*1.6, 1), t, 0.03);

    // AM 频率 24 + rps*4.5
    nodes.lfo.frequency.setTargetAtTime(24 + speed * 5, t, 0.08);

    // 哇音中心频率（核心哇哇效果，加大扫频范围）
    var wf = 760 + 520 * active + (500 + 400 * active) * Math.sin(ropeAngle - 0.7);
    nodes.wah.frequency.setTargetAtTime(Math.max(300, wf), t, 0.02);

    // 噪声增益
    nodes.nGain.gain.setTargetAtTime((0.05 + 0.20 * active) * Math.min(drive * 4, 1), t, 0.06);
  }

  suspend() {
    if (this.ctx && this.ctx.state === 'running') { this.ctx.suspend(); this.suspended = true; }
  }
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(function(){});
      this.suspended = false;
    }
  }
  get state() { return this.ctx ? this.ctx.state : 'unknown'; }
}

/* ============================================================
 * Canvas 2D 渲染模块：竹签、绳子、竹蝉
 * ============================================================ */
class CicadaRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.w = 0; this.h = 0; this.dpr = 1;
    this.trail = [];
    this.maxTrail = 8;
    this.waParticles = [];
    this.waSpawnAccum = 0;
    // 加载小虫图片
    this.cicadaImg = new Image();
    this.cicadaImg.src = './tx.png';
  }

  resize() {
    this.dpr = window.devicePixelRatio || 1;
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width = this.w * this.dpr;
    this.canvas.height = this.h * this.dpr;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  draw(physics, speed, holding, dt) {
    const { ctx, w, h } = this;
    // 背景
    ctx.fillStyle = '#0a1028';
    ctx.fillRect(0, 0, w, h);
    // 径向光晕
    const cx = w / 2, cy = h / 2;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    grad.addColorStop(0, 'rgba(26,36,72,0.45)');
    grad.addColorStop(1, 'rgba(10,16,40,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // 运动残影（转速越快残影越长）
    this.trail.push({ x: physics.mass.x, y: physics.mass.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    if (speed > 1.5 && this.trail.length > 2) {
      ctx.strokeStyle = 'rgba(168,176,106,0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < this.trail.length; i++) {
        const p = this.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    // 绘制竹签、绳子、竹蝉
    this._drawStick(physics.anchor.x, physics.anchor.y, holding);
    this._drawRope(physics.anchor.x, physics.anchor.y, physics.mass.x, physics.mass.y, physics.tension);
    const angle = Math.atan2(physics.mass.x - physics.anchor.x, physics.mass.y - physics.anchor.y);
    this._drawCicada(physics.mass.x, physics.mass.y, angle, speed);
    // 生成并绘制"哇"文字粒子
    this.spawnWa(speed, physics.mass.x, physics.mass.y);
    this._drawWaParticles(dt || 0.016);
  }

  _drawStick(x, y, holding) {
    const ctx = this.ctx;
    ctx.save(); ctx.translate(x, y);
    const sLen = 28, sW = 7;
    // 竹签主体
    ctx.fillStyle = '#a8b06a'; ctx.strokeStyle = '#6b7340'; ctx.lineWidth = 1;
    this._roundRect(-sW/2, -sLen/2, sW, sLen, 3); ctx.fill(); ctx.stroke();
    // 竹节纹理
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-sW/2, -sLen/4); ctx.lineTo(sW/2, -sLen/4);
    ctx.moveTo(-sW/2, sLen/4); ctx.lineTo(sW/2, sLen/4);
    ctx.stroke();
    // 按住时的光晕
    if (holding) {
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(226,96,63,0.15)'; ctx.fill();
    }
    ctx.restore();
  }

  _drawRope(ax, ay, mx, my, tension) {
    const ctx = this.ctx;
    ctx.strokeStyle = 'rgba(240,230,210,' + (0.3 + tension * 0.3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mx, my); ctx.stroke();
  }

  _drawCicada(x, y, angle, speed) {
    const ctx = this.ctx;
    const img = this.cicadaImg;
    const imgSize = 60;
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    // 发声光圈
    if (speed > 0.3) {
      const now = performance.now();
      const p = (Math.sin(now * 0.015) + 1) * 0.5;
      ctx.strokeStyle = 'rgba(226,96,63,' + (0.15 * p) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, imgSize * 0.5 + p * 6, 0, Math.PI*2); ctx.stroke();
    }
    if (img && img.complete) {
      ctx.drawImage(img, -imgSize/2, -imgSize/2, imgSize, imgSize);
    } else {
      // 图片未加载时的占位
      ctx.fillStyle = '#a8b06a';
      ctx.beginPath(); ctx.arc(0, 0, imgSize/2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  _roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // 生成"哇"文字粒子（转速越快生成越多）
  spawnWa(speed, x, y) {
    if (speed < 0.3) return;
    // 每圈约生成 2 个粒子
    this.waSpawnAccum += speed * 0.033;
    while (this.waSpawnAccum >= 1) {
      this.waSpawnAccum -= 1;
      var isDouble = Math.random() < 0.3;  // 30% 概率出现"哇哇"
      this.waParticles.push({
        x: x + (Math.random() - 0.5) * 30,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 40,
        vy: -60 - Math.random() * 40,
        life: 1.0,
        size: 16 + Math.random() * 12,
        text: isDouble ? '哇哇' : '哇',
        rot: (Math.random() - 0.5) * 0.3
      });
    }
  }

  // 绘制并更新"哇"文字粒子
  _drawWaParticles(dt) {
    var ctx = this.ctx;
    var alive = [];
    for (var i = 0; i < this.waParticles.length; i++) {
      var p = this.waParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 20 * dt;  // 轻微重力
      p.life -= dt * 0.8;
      if (p.life > 0) {
        var alpha = Math.min(p.life, 1);
        var scale = 0.6 + p.life * 0.4;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(scale, scale);
        ctx.font = 'bold ' + p.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // 描边
        ctx.strokeStyle = 'rgba(226,96,63,' + (alpha * 0.8) + ')';
        ctx.lineWidth = 3;
        ctx.strokeText(p.text, 0, 0);
        // 填充
        ctx.fillStyle = 'rgba(255,220,140,' + alpha + ')';
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
        alive.push(p);
      }
    }
    this.waParticles = alive;
  }

  clearTrail() { this.trail = []; }
}

/* ============================================================
 * 主应用（纯原生 JS，零依赖）
 * ============================================================ */
(function() {
  // DOM 元素引用
  const canvas = document.getElementById('cv');
  const elUnlock = document.getElementById('unlock');
  const elHint = document.getElementById('hint');
  const elSpeedVal = document.getElementById('speedVal');
  const elBtnAuto = document.getElementById('btnAuto');
  const elBtnMotion = document.getElementById('btnMotion');
  const elBtnMute = document.getElementById('btnMute');

  // 核心对象
  const physics = new CicadaPhysics();
  const audio = new CicadaAudio();
  const renderer = new CicadaRenderer(canvas);

  // 状态变量
  let rafId = null, lastTime = 0, lastIdleTime = 0;
  let pointerActive = false, pointerId = null;
  let anchorOffset = { x: 0, y: 0 };
  let autoAngle = 0, autoSwing = false, motionMode = false;
  let muted = false;  // 静音状态

  // === 初始化 ===
  function init() {
    renderer.resize();
    window.addEventListener('resize', onResize);

    const ropeLength = Math.min(window.innerWidth, window.innerHeight) * 0.28;
    physics.init(window.innerWidth / 2, window.innerHeight * 0.38, ropeLength);

    checkMotionSupport();

    // 触屏设备显示首次开声引导
    if ('ontouchstart' in window) {
      elUnlock.classList.remove('gone');
    }

    // 注册输入事件
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('keydown', onKeyDown);

    // 按钮事件
    elUnlock.addEventListener('click', unlockAudio);
    elBtnAuto.addEventListener('click', toggleAutoSwing);
    elBtnMotion.addEventListener('click', toggleMotion);
    elBtnMute.addEventListener('click', toggleMute);

    // 启动动画循环
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);

    // 暴露调试接口
    window.__debug = { physics: physics, audio: audio, renderer: renderer, getAnchorOmega: function() { return anchorOmega; } };
  }

  // === 窗口大小变化 ===
  function onResize() {
    renderer.resize();
    const ropeLength = Math.min(window.innerWidth, window.innerHeight) * 0.28;
    physics.anchor.x = window.innerWidth / 2;
    physics.anchor.y = window.innerHeight * 0.38;
    physics.ropeLength = ropeLength;
  }

  // === 指针交互（按住画圈）===
  let lastAnchorAngle = 0;
  let lastAnchorTime = 0;
  let anchorOmega = 0;
  let pointerKicked = false;

  function onPointerDown(e) {
    e.preventDefault();
    if (pointerActive) return;
    pointerActive = true;
    pointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);

    if (!audio.initialized) { audio.init(); elUnlock.classList.add('gone'); }
    if (audio.state === 'suspended') audio.resume();

    canvas.classList.add('holding');
    elHint.classList.add('gone');

    const isTouch = e.pointerType === 'touch';
    anchorOffset.y = isTouch ? -60 : 0;
    var px = e.clientX + anchorOffset.x;
    var py = e.clientY + anchorOffset.y;
    physics.setAnchor(px, py);
    lastAnchorAngle = Math.atan2(py - physics.mass.y, px - physics.mass.x);
    lastAnchorTime = performance.now();
    anchorOmega = 0;
    pointerKicked = false;
    resetIdle();
  }

  function onPointerMove(e) {
    if (!pointerActive || e.pointerId !== pointerId) return;
    e.preventDefault();
    var px = e.clientX + anchorOffset.x;
    var py = e.clientY + anchorOffset.y;
    physics.setAnchor(px, py);

    // 首次移动时给竹蝉一个初始切向力
    if (!pointerKicked) {
      pointerKicked = true;
      var rdx = physics.mass.x - px;
      var rdy = physics.mass.y - py;
      var rDist = Math.sqrt(rdx*rdx + rdy*rdy) || 1;
      var tx = -rdy / rDist;
      var ty = rdx / rDist;
      var v0 = 12 * physics.ropeLength;
      physics.vel.x = tx * v0;
      physics.vel.y = ty * v0;
    }
    resetIdle();
  }

  function onPointerUp(e) {
    if (!pointerActive) return;
    pointerActive = false;
    pointerId = null;
    canvas.classList.remove('holding');
    if (audio.state === 'suspended') audio.resume();
    resetIdle();
  }

  // === 键盘（空格切换自动甩）===
  function onKeyDown(e) {
    if (e.code === 'Space') { e.preventDefault(); toggleAutoSwing(); }
  }

  // === 自动甩模式 ===
  function toggleAutoSwing() {
    if (!audio.initialized) { audio.init(); elUnlock.classList.add('gone'); }
    if (audio.state === 'suspended') audio.resume();

    autoSwing = !autoSwing;
    elBtnAuto.textContent = autoSwing ? '停止甩' : '自动甩';
    elBtnAuto.classList.toggle('on', autoSwing);
    elHint.classList.add('gone');

    if (autoSwing) {
      // 给竹蝉一个初始切向速度（增大力度保证启动）
      const tx = -(physics.mass.y - physics.anchor.y);
      const ty = physics.mass.x - physics.anchor.x;
      const len = Math.sqrt(tx*tx + ty*ty) || 1;
      physics.kick((tx/len) * 800, (ty/len) * 800);
    }
    resetIdle();
  }

  // === 设备体感模式 ===
  function checkMotionSupport() {
    let supported = false;
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      supported = true; // iOS 13+ 需要请求权限
    } else if ('DeviceMotionEvent' in window) {
      supported = window.isSecureContext; // 普通 http 局域网地址不派发传感器事件
    }
    if (supported) {
      elBtnMotion.classList.remove('gone');
    }
  }

  async function toggleMotion() {
    if (!motionMode) {
      // iOS 需要请求权限
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try { if ((await DeviceMotionEvent.requestPermission()) !== 'granted') return; } catch { return; }
      }
      if (!audio.initialized) { audio.init(); elUnlock.classList.add('gone'); }
      motionMode = true;
      elBtnMotion.textContent = '关体感';
      elBtnMotion.classList.add('on');
      window.addEventListener('devicemotion', onDeviceMotion);
    } else {
      motionMode = false;
      elBtnMotion.textContent = '甩手机';
      elBtnMotion.classList.remove('on');
      window.removeEventListener('devicemotion', onDeviceMotion);
    }
    resetIdle();
  }

  // === 静音切换 ===
  function toggleMute() {
    muted = !muted;
    elBtnMute.textContent = muted ? '🔇' : '🔊';
    elBtnMute.classList.toggle('muted', muted);
    if (muted) {
      audio.suspend();
    } else {
      audio.resume();
    }
  }

  function onDeviceMotion(e) {
    if (!motionMode) return;
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x == null) return;
    // 重力方向在机身坐标里转动，直接驱动锚点
    const cx = window.innerWidth / 2, cy = window.innerHeight * 0.38;
    const radius = Math.min(window.innerWidth, window.innerHeight) * 0.12;
    const gMag = Math.sqrt(acc.x * acc.x + acc.y * acc.y) || 1;
    physics.setAnchor(cx + (acc.x / gMag) * radius * 2.5, cy - (acc.y / gMag) * radius * 2.5);
    resetIdle();
  }

  // === 解锁音频 ===
  function unlockAudio() {
    audio.init();
    elUnlock.classList.add('gone');
    if (audio.state === 'suspended') audio.resume();
  }

  // === 动画主循环 ===
  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // 物理更新
    const newRevs = physics.update(dt);
    var curSpeed = physics.getSpeed();

    // 手动甩：用锚点运动计算角速度（不受物理阻尼影响）
    if (pointerActive && !autoSwing) {
      // 锚点相对竹蝉的角度变化率
      var ax = physics.anchor.x;
      var ay = physics.anchor.y;
      var mdx = physics.mass.x - ax;
      var mdy = physics.mass.y - ay;
      var curAngle = Math.atan2(mdy, mdx);
      var dA = curAngle - lastAnchorAngle;
      if (dA > Math.PI) dA -= 2 * Math.PI;
      if (dA < -Math.PI) dA += 2 * Math.PI;
      var now2 = performance.now();
      var dt2 = Math.max(0.001, (now2 - lastAnchorTime) / 1000);
      var instOmega = dA / dt2;
      // 平滑
      anchorOmega = anchorOmega * 0.7 + instOmega * 0.3;
      lastAnchorAngle = curAngle;
      lastAnchorTime = now2;
      // 用锚点角速度驱动音频
      var anchorRps = Math.abs(anchorOmega) / (2 * Math.PI);
      curSpeed = Math.max(curSpeed, anchorRps * 0.8);
    } else {
      anchorOmega *= 0.9;
    }

    // 自动甩：物理更新后强制驱动竹蝉做圆周运动
    if (autoSwing && !pointerActive) {
      const cx = window.innerWidth / 2, cy = window.innerHeight * 0.38;
      physics.setAnchor(cx, cy);
      var targetOmega = 16;
      autoAngle += targetOmega * dt;
      // 强制设置位置和速度
      physics.mass.x = cx + Math.cos(autoAngle) * physics.ropeLength;
      physics.mass.y = cy + Math.sin(autoAngle) * physics.ropeLength;
      physics.vel.x = -Math.sin(autoAngle) * targetOmega * physics.ropeLength;
      physics.vel.y = Math.cos(autoAngle) * targetOmega * physics.ropeLength;
      // 手动计算角速度（绕过物理阻尼）
      physics.angularVel = targetOmega;
      physics.smoothSpeed = targetOmega / (2 * Math.PI);
      curSpeed = physics.smoothSpeed;
    }

    // 更新转速显示
    elSpeedVal.textContent = curSpeed.toFixed(1);

    // 更新音频
    audio.update(curSpeed, physics.getAngle(), physics.tension);

    // 渲染
    renderer.draw(physics, curSpeed, pointerActive, dt);

    // 空闲检测：静置 8 秒挂起音频省电
    if (curSpeed < 0.1 && !pointerActive && !autoSwing && !motionMode) {
      if (now - lastIdleTime > 8000 && audio.state === 'running') audio.suspend();
    } else {
      lastIdleTime = now;
      if (audio.state === 'suspended') audio.resume();
    }

    rafId = requestAnimationFrame(loop);
  }

  function resetIdle() {
    lastIdleTime = performance.now();
    if (audio.state === 'suspended') audio.resume();
  }

  // 启动
  init();
})();
</script>
