    //默认浏览器打开链接
    function openInDefault(url) {
        copyText(url)//先复制
        const u = new URL(url);

        const intentUrl =
            "intent://" +
            u.host + u.pathname + u.search + u.hash +
            "#Intent;" +
            "scheme=" + u.protocol.replace(":", "") + ";" +
            "action=android.intent.action.VIEW;" +
            "end";
    
        window.location.href = intentUrl;
    }
        /* 宣发通知列表 */

            欢迎加入忆兰反网戒群（于此补充信息）：<a
                href="mqqapi://card/show_pslcard?src_type=internal&version=1&uin=1075965802&card_type=group&source=qrcode"

            `,

            `
            欢迎使用
            <a href="javascript:openInDefault('https://pan.quark.cn/s/09408d72644e');">“哔哩发评反诈”</a>
            以检查<strong> B 站发送评论是否被系统吞掉！</strong>
            `,

            `
            欢迎查看
            <a href="javascript:openInDefault('https://pan.quark.cn/s/4852bb83e3eb');">反网戒知识库</a>
            ，内含各类反网戒相关文档：<strong>指南、举报信模板、分析</strong>
            `
        ];


        let groupNoticeIndex = 0;


        function showGroupNotice(index) {
            const content = document.getElementById("groupNoticeContent");

            content.classList.add("fade-out");

            setTimeout(() => {
                content.innerHTML = groupNotices[index];
                content.classList.remove("fade-out");
            }, 400);
        }


        function startGroupNoticeLoop() {
            showGroupNotice(groupNoticeIndex);

            setInterval(() => {
                groupNoticeIndex++;

                if (groupNoticeIndex >= groupNotices.length) {
                    groupNoticeIndex = 0;
                }

                showGroupNotice(groupNoticeIndex);

            }, 5000);
        }

    window.addEventListener("DOMContentLoaded", () => {
            startGroupNoticeLoop();
        });

        function showToast(msg) {

        function copyText(str, e) {
            if (e) e.stopPropagation();
            if (!str || str === "暂未公开") {
                showToast("暂无可复制内容");
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(str);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = str;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy'); } catch (err) { }
                document.body.removeChild(textarea);
            }
            showToast("已复制");
        }

        function fetchWithTimeout(url, options = {}, timeout = 8000) {
            return Promise.race([
                fetch(url, options),
                new Promise((_, reject) => setTimeout(() => reject(new Error('网络请求超时，请检查您的移动网络状态')), timeout))
            ]);
        }

        async function start() {
            try {
                myChart = echarts.init(mapContainer, null, {
                    renderer: 'canvas',
                    useDirtyRect: true,
                    touchResponseSensitivity: 0.3
                });

                window.addEventListener('resize', () => {
                    if (myChart) {
                        myChart.resize();
                    }
                    setPanelState(currentState, false);
                });

                const [geoJson, textData] = await Promise.all([
                    fetchChinaGeoJson(),
                    fetchTxtData()
                ]);

                echarts.registerMap('_china', geoJson);

                const parsed = parseTextData(textData);
                cachedParsedData = parsed.counts;
                rawOrgList = parsed.orgs;

                initProvinceSelect();
                renderMap(cachedParsedData);
                renderRankList(cachedParsedData);
                setupMapClick();

                loadingMask.style.display = 'none';
                // 确保默认初始化时处于“半展开”状态
                setPanelState('half', false);

            } catch (error) {
                spinner.style.display = 'none';
                loadingText.style.color = '#dc2626';
                loadingText.innerHTML = `<strong>无法加载数据或地图</strong>`;
                errorDetail.style.display = 'block';
                errorDetail.innerHTML = `
                    <strong>错误原因：</strong>${error.message}<br><br>
                    <strong>建议解决方案：</strong><br>
                    1. 如果是 TXT 请求被阻断，请确认服务端 <code>me.yllty.de</code> 已允许跨域（CORS）。<br>
                    2. 请刷新页面重试或检查手机网络连接。
                `;
            }
        }

        async function fetchChinaGeoJson() {
            const urls = ['/school-map/china.json'];
            for (let url of urls) {
                try {
                    const res = await fetchWithTimeout(url, {}, 8000);
                    if (res.ok) return await res.json();
                } catch (e) { }
            }
            throw new Error('地图底图（GeoJSON）节点连接失败');
        }

        async function fetchTxtData() {
            try {
                const res = await fetchWithTimeout(DATA_URL, {}, 8000);
                if (!res.ok) throw new Error(`数据请求返回异常代码（HTTP ${res.status}）`);
                return await res.text();
            } catch (e) {
                throw new Error(`获取机构列表失败 (${e.message})`);
            }
        }

        // 强健的文本数据解析算法
        function parseTextData(text) {
            const counts = {};
            const orgs = [];

            provinceMap.forEach(item => {
                counts[item.name] = { total: 0, cancelled: 0, active: 0 };
            });

            const lines = text.split(/\r?\n/);
            lines.forEach((line, index) => {
                let trimmed = line.trim();
                // 过滤空行与以 # 开头的注释行
                if (!trimmed || trimmed.startsWith('#')) return;

                // 清理开头的符号，如 【 [ 以及末尾符号
                trimmed = trimmed.replace(/^[【\[\s]+/, '').replace(/[】\]]+$/, '').trim();
                if (!trimmed) return;

                // 省份匹配（支持开头匹配或全局包含）
                let matchedProv = "其他";
                for (let prov of provinceMap) {
                    if (prov.pattern.test(trimmed) || trimmed.startsWith(prov.name)) {
                        matchedProv = prov.name;
                        break;
                    }
                }

                // 判断状态：关闭、注销、吊销、存续
                let isHot = /\bHOT\b/i.test(trimmed);

                let status = "存续";
                if (trimmed.includes('关闭') || trimmed.includes('已关闭')) {
                    status = "关闭";
                } else if (trimmed.includes('吊销') || trimmed.includes('已吊销')) {
                    status = "吊销";
                } else if (trimmed.includes('注销') || trimmed.includes('已注销')) {
                    status = "注销";
                }

                if (matchedProv !== "其他") {
                    counts[matchedProv].total++;
                    if (status === "存续") {
                        counts[matchedProv].active++;
                    } else {
                        // 注销/关闭/吊销均计入非存续
                        counts[matchedProv].cancelled++;
                    }
                }

                // 提取机构名称（空格前的主体部分）
                let rawNameToken = trimmed.split(/\s+/)[0] || trimmed;
                rawNameToken = rawNameToken.replace(/(已注销|注销|已关闭|关闭|已吊销|吊销)$/, '');

                let cleanName = rawNameToken;
                if (rawNameToken.includes('/')) {
                    const subNames = rawNameToken.split('/');
                    cleanName = subNames[subNames.length - 1] || rawNameToken;
                }

                // 提取法定代表人/校长/高层/负责人
                let legalPerson = "暂未公开";
                const legalMatch = trimmed.match(/(?:法定代表人|法人|负责人|校长|高层)[:：]?\s*([^\s,;，；]+)/);
                if (legalMatch) {
                    legalPerson = legalMatch[1];
                }

                orgs.push({
                    id: index + 1,
                    name: cleanName,
                    fullName: rawNameToken,
                    province: matchedProv,
                    status: status,
                    isHot: isHot,
                    legalPerson: legalPerson,
                    rawLine: trimmed
                });
            });

            return { counts, orgs };
        }

        function renderMap(countsData) {
            const selectedMetric = document.getElementById('mapMetric').value;
            const selectedColorKey = document.getElementById('colorScheme').value;
            const isMobile = window.innerWidth <= 600;

            const seriesData = Object.keys(countsData).map(provName => {
                const item = countsData[provName];
                const cancelRateNum = item.total > 0 ? (item.cancelled / item.total) * 100 : 0;

                let val = item.total;
                if (selectedMetric === 'active') val = item.active;
                else if (selectedMetric === 'cancelled') val = item.cancelled;
                else if (selectedMetric === 'cancelRate') val = Number(cancelRateNum.toFixed(1));

                return {
                    name: provinceToMapName(provName),
                    value: val,
                    total: item.total,
                    cancelled: item.cancelled,
                    active: item.active,
                    cancelRate: cancelRateNum.toFixed(1)
                };
            });

            const maxVal = Math.max(...seriesData.map(item => item.value), selectedMetric === 'cancelRate' ? 10 : 5);

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (!params.data) return `<strong>${params.name}</strong><br/>暂无统计数据`;
                        const { total = 0, cancelled = 0, active = 0, cancelRate = '0.0' } = params.data;
                        return `
                            <strong>${params.name}</strong><br/>
                            总数：<strong>${total}</strong> 家<br/>
                            现存数：<strong>${active}</strong> 家<br/>
                            注销/关闭：<strong>${cancelled}</strong> 家<br/>
                            注销/关闭率：<strong>${cancelRate}%</strong>
                        `;
                    },
                    confine: true
                },
                visualMap: {
                    min: 0,
                    max: maxVal,
                    left: '5%',
                    bottom: '8%',
                    text: selectedMetric === 'cancelRate' ? ['高 (%)', '低 (%)'] : ['高', '低'],
                    calculable: true,
                    itemWidth: 12,
                    itemHeight: 90,
                    inRange: { color: colorPalette[selectedColorKey] }
                },
                series: [{
                    name: '机构分布',
                    type: 'map',
                    map: '_china',
                    roam: true,
                    zoom: 1.1,
                    zoomSensitivity: 0.5,
                    scaleLimit: { min: 0.6, max: 12 },
                    label: { show: !isMobile, fontSize: 10 },
                    emphasis: {
                        label: { show: true, fontSize: 12 },
                        itemStyle: { areaColor: '#fde047' }
                    },
                    data: seriesData
                }]
            };

            myChart.setOption(option, true);
        }

        function setupMapClick() {

        function renderRankList(countsData) {
            const field = document.getElementById('rankSortField').value;
            const sortOrder = document.getElementById('rankSortOrder').value;
            const colorKey = document.getElementById('colorScheme').value;

            let nationalTotal = 0;
            const list = Object.keys(countsData).map(name => {
                const item = countsData[name];
                nationalTotal += item.total;
                const cancelRate = item.total > 0 ? (item.cancelled / item.total) * 100 : 0;
                let val = item[field];
                if (field === 'cancelRate') val = cancelRate;

                return { name, total: item.total, active: item.active, cancelled: item.cancelled, cancelRate, value: val };
            });

            list.sort((a, b) => sortOrder === 'desc' ? b.value - a.value : a.value - b.value);

            const rankListEl = document.getElementById('rankList');
            const themeColor = colorPalette[colorKey][2];

            rankListEl.innerHTML = list.map((item, index) => {
                const percent = nationalTotal > 0 ? ((item.total / nationalTotal) * 100).toFixed(1) : 0;
                const displayNum = index + 1;
                let valueDisplay = `${item.value} 家 <span style="color:#9ca3af; font-size:10px;">(${percent}%)</span>`;
                let barWidthPercent = percent;

                if (field === 'cancelRate') {
                    valueDisplay = `${item.cancelRate.toFixed(1)}% <span style="color:#9ca3af; font-size:10px;">(${item.cancelled}/${item.total})</span>`;
                    barWidthPercent = item.cancelRate.toFixed(1);
                }

                return `
                    <div class="rank-item" style="cursor:pointer;" onclick="selectProvinceFromRank('${item.name}')">
                        <div class="rank-num ${displayNum <= 3 ? 'top3' : ''}">${displayNum}</div>
                        <div class="rank-name">${item.name}</div>
                        <div class="rank-bar-wrapper">
                            <div class="rank-bar-inner" style="width: ${barWidthPercent}%; background-color: ${themeColor}"></div>
                        </div>
                        <div class="rank-value">${valueDisplay}</div>
                    </div>
                `;
            }).join('');
        }

        function filterAndRenderOrgs() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const provFilter = document.getElementById('provinceFilter').value;

            filteredOrgList = rawOrgList.filter(item => {
                const matchProv = !provFilter || item.province === provFilter;
                const matchQuery = !query ||
                    item.rawLine.toLowerCase().includes(query) ||
                    item.name.toLowerCase().includes(query) ||
                    item.legalPerson.toLowerCase().includes(query);
                return matchProv && matchQuery;
            });

            const countElement = document.getElementById('searchResultCount');
            if (countElement) {
                countElement.textContent = `共 ${filteredOrgList.length} 个结果`;

            renderOrgCards(true);

        function renderOrgCards(reset = false) {
            const container = document.getElementById('orgListContainer');
            if (reset) {
                container.scrollTop = 0;
                container.innerHTML = '';

            if (filteredOrgList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; font-size:12px; color:#9ca3af;">未搜索到符合条件的机构</div>`;
                return;
            }

            const pageData = filteredOrgList.slice((pageIndex - 1) * PAGE_SIZE, pageIndex * PAGE_SIZE);

            const htmlArr = pageData.map(item => {
                // 状态颜色划分：存续(绿)、注销(红)、关闭(黄)、吊销(深红)
                let tagClass = 'status-active';
                if (item.status === '注销') tagClass = 'status-cancelled';
                else if (item.status === '关闭') tagClass = 'status-closed';
                else if (item.status === '吊销') tagClass = 'status-revoked';

                return `
                    <div class="org-card" onclick="openDetail(${item.id})">
                        <div class="org-card-header">
                             <div class="org-title">${item.name}</div>
                             <div style="display:flex;gap:4px;align-items:center;">

        /* -------------------------------------------------------------
 * 核心修复：完美跟手、解决触底瞬间跳变的无缝手势衔接
 * ------------------------------------------------------------- */
        const rankPanel = document.getElementById('rankPanel');
        const dragArea = document.getElementById('dragArea');

        let currentState = 'half'; // 'full', 'half', 'collapsed'
        let startY = 0;
        let startTransformY = 0;
        let isDragging = false;
        let touchScrollTarget = null;
        let isBoundaryReached = false; // 标记是否触发了边界衔接

        // 计算不同状态下 TransformY 偏移像素量
        function getTranslateForState(state) {
            const panelHeight = rankPanel.offsetHeight;
            if (state === 'full') return 0; // 全屏
            if (state === 'half') return panelHeight * 0.45; // 中间半展开
            return panelHeight - 54; // 底部折叠收起
        }

        // 获取当前 TransformY 偏移行
        function getCurrentTransformY() {
            const style = window.getComputedStyle(rankPanel);
            const matrix = new DOMMatrix(style.transform);
            return matrix.m42;
        }

        function setPanelState(state, animate = true) {
            currentState = state;
            const targetY = getTranslateForState(state);
            rankPanel.style.transition = animate ? 'transform 0.25s ease-out' : 'none';
            rankPanel.style.transform = `translateY(${targetY}px)`;
            setTimeout(() => { if (myChart) myChart.resize(); }, 300);
        }

        function snapToClosestState() {
            const currentY = getCurrentTransformY();
            const panelHeight = rankPanel.offsetHeight;

            if (currentY < panelHeight * 0.22) {
                setPanelState('full');
            } else if (currentY < panelHeight * 0.70) {
                setPanelState('half');
            } else {
                setPanelState('collapsed');
            }
        }

        // 辅助检测：获取可滚动的父容器
        function findScrollableParent(el) {
            let curr = el;
            while (curr && curr !== rankPanel) {
                if (curr.classList && curr.classList.contains('rank-body')) {
                    return curr;
                }
                curr = curr.parentElement;
            }
            return null;
        }

        // ---------------- 移动端 Touch 事件（解决触底跳变的重置机制） ----------------
        rankPanel.addEventListener('touchstart', (e) => {
            if (['SELECT', 'INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) return;

            startY = e.touches[0].clientY;
            startTransformY = getCurrentTransformY();
            isDragging = false;
            isBoundaryReached = false;
            touchScrollTarget = findScrollableParent(e.target);
        }, { passive: true });

        rankPanel.addEventListener('touchmove', (e) => {
            if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;

            const currentY = e.touches[0].clientY;
            let diffY = currentY - startY;

            // 如果处于内部列表区域，判断滚动边界
            if (touchScrollTarget) {
                const scrollTop = touchScrollTarget.scrollTop;
                const scrollHeight = touchScrollTarget.scrollHeight;
                const clientHeight = touchScrollTarget.clientHeight;

                const isAtTop = scrollTop <= 0;
                // 使用 1px 容错判断是否触底
                const isAtBottom = Math.abs((scrollTop + clientHeight) - scrollHeight) <= 1;

                // 如果在列表中间（非触顶向上拉，非触底向下拉），让原生滚动接管
                if ((diffY > 0 && !isAtTop) || (diffY < 0 && !isAtBottom)) {
                    // 在列表中间滚动时，不断更新起点，防止到达边缘时计算出巨大的 diffY 导致瞬间跳变
                    startY = currentY;
                    startTransformY = getCurrentTransformY();
                    return;
                }

                // 首次刚触发触顶/触底边缘衔接时，重置起始位置，实现无缝跟手
                if (!isBoundaryReached) {
                    isBoundaryReached = true;
                    startY = currentY;
                    startTransformY = getCurrentTransformY();
                    diffY = 0; // 重置本次 diffY
                }
            }

            // 触发抽屉拖拽跟手
            if (Math.abs(diffY) > 2 || isDragging) {
                isDragging = true;
                let targetY = startTransformY + diffY;

                // 边界限制
                if (targetY < 0) targetY = 0;
                const maxY = getTranslateForState('collapsed');
                if (targetY > maxY) targetY = maxY;

                // 实时跟手，关闭动画过渡
                rankPanel.style.transition = 'none';
                rankPanel.style.transform = `translateY(${targetY}px)`;
            }
        }, { passive: true });

        rankPanel.addEventListener('touchend', (e) => {
            if (isDragging) {
                snapToClosestState();
                isDragging = false;
            }
            isBoundaryReached = false;
        });

        // ---------------- PC 端 Mouse 鼠标拖拽 ----------------
        let isMouseDown = false;

        rankPanel.addEventListener('mousedown', (e) => {
            if (['SELECT', 'INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) return;

            const scrollable = findScrollableParent(e.target);
            if (scrollable) {
                const isAtTop = scrollable.scrollTop <= 0;
                const isAtBottom = Math.abs((scrollable.scrollTop + scrollable.clientHeight) - scrollable.scrollHeight) <= 1;
                if (!isAtTop && !isAtBottom) return;
            }

            isMouseDown = true;
            startY = e.clientY;
            startTransformY = getCurrentTransformY();
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const diffY = e.clientY - startY;

            if (Math.abs(diffY) > 2) isDragging = true;

            if (isDragging) {
                let targetY = startTransformY + diffY;
                if (targetY < 0) targetY = 0;
                const maxY = getTranslateForState('collapsed');
                if (targetY > maxY) targetY = maxY;

                rankPanel.style.transition = 'none';
                rankPanel.style.transform = `translateY(${targetY}px)`;
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isMouseDown) return;
            isMouseDown = false;
            if (isDragging) {
                snapToClosestState();
                isDragging = false;
            }
        });

        // 单击顶部拖拽手柄切换状态
        dragArea.addEventListener('click', (e) => {
            if (['SELECT', 'OPTION', 'LABEL', 'INPUT', 'BUTTON'].includes(e.target.tagName)) return;
            if (!isDragging) {
                if (currentState === 'collapsed') setPanelState('half');
                else if (currentState === 'half') setPanelState('full');
                else setPanelState('half');
            }
        });

        //==========拖拽部分结束

        // 绑定搜索与筛选控件事件
        let searchTimer = null;
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);

            clearSearchBtn.style.display =
                searchInput.value ? 'block' : 'none';

            searchTimer = setTimeout(() => filterAndRenderOrgs(), 200);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';

            filterAndRenderOrgs();
        });

        document.getElementById('provinceFilter').addEventListener('change', filterAndRenderOrgs);

        document.getElementById('colorScheme').addEventListener('change', () => {
            if (cachedParsedData) {
                renderMap(cachedParsedData);
                renderRankList(cachedParsedData);
            }
        });

        document.getElementById('mapMetric').addEventListener('change', () => {
            if (cachedParsedData) renderMap(cachedParsedData);
        });

        document.getElementById('rankSortField').addEventListener('change', () => {
            if (cachedParsedData) renderRankList(cachedParsedData);
        });

        document.getElementById('rankSortOrder').addEventListener('change', () => {
            if (cachedParsedData) renderRankList(cachedParsedData);
        });

        start();
    </script>
</body>

</html>
