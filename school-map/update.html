<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用版本更新</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .version-badge {
            display: inline-block;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .content-box {
            text-align: left;
            background-color: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
            color: #4b5563;
        }

        .content-box ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #1a73e8;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #1557b0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .tip {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-container">
        <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
    </div>

    <h1>客户端需要更新</h1>
    <div class="version-badge">v3.0.1</div>

    <div class="content-box">
        <p><strong>更新内容：</strong></p>
        <ul>
            <li>增加 Logo</li>
            <li>修复已知 Bug 并提升性能</li>
        </ul>
    </div>

    <button class="btn" onclick="handleDownload()">立即下载更新</button>

    <p class="tip">如无法跳转，点击按钮后下载链接已自动复制至剪贴板</p>
</div>

<script>
    
    const downloadUrl = "https://pan.quark.cn/s/ccfa0ffb0c1b";

    // 复制文本辅助函数
    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => {
                fallbackCopyText(text);
            });
        } else {
            fallbackCopyText(text);
        }
    }

    // 降级处理复制方法
    function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
        } catch (err) {
            console.error('复制失败:', err);
        }
        document.body.removeChild(textArea);
    }

    // 唤起默认浏览器/应用的 Intent 函数
    function openInDefault(url) {
        copyText(url); // 先复制
        const u = new URL(url);

        const intentUrl =
            "intent://" +
            u.host + u.pathname + u.search + u.hash +
            "#Intent;" +
            "scheme=" + u.protocol.replace(":", "") + ";" +
            "action=android.intent.action.VIEW;" +
            "end";

        window.location.href = intentUrl;
    }

    // 按钮点击响应函数
    function handleDownload() {
        openInDefault(downloadUrl);
    }
</script>

</body>
</html>
